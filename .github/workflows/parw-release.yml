name: PRAW release (macOS ARM)

# Automated build of PRAW — the self-hosted, Warp-infrastructure-free build.
# - Tag push parw-v*: builds the package and publishes the DMG as a release.
# - workflow_dispatch: build on demand from any branch (artifact, no release
#   unless run from a tag).
# Branch pushes do not build: each macOS run costs ~2 hours; correctness on
# push is covered by parw-tests.yml instead.

on:
  push:
    tags: ["parw-v*"]
  workflow_dispatch:

permissions:
  contents: write

# A manual rebuild of a commit should replace its push-triggered build, rather
# than running a second expensive macOS release build for the same ref.
concurrency:
  group: parw-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (M1)
    # Heavy merges can push the build past 100 minutes; the margin matters
    # because a timeout during "Publish release" would cut a finished build
    # off from its release.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the packaging script's `git describe` can find
          # the latest parw-v* tag when PARW_VERSION is unset.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app

      # prost-build invokes protoc for the multi-agent protobuf types.
      - name: Install protobuf
        run: brew install protobuf

      # Newer Xcode images ship without the Metal toolchain; the GUI build
      # compiles WGSL-backed shaders through `xcrun metal`.
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build release binaries
        run: |
          cargo build --release -p warp --bin warp-oss
          cargo build --release -p warp_tui --bin warp-tui-oss
          cargo build --release -p selfhost_server

      # The script builds the decorated DMG itself (background, icon layout,
      # Applications link) with a plain-DMG fallback for headless runners.
      - name: Package PRAW
        run: |
          if [[ "$GITHUB_REF_NAME" == parw-v* ]]; then
            export PARW_VERSION="${GITHUB_REF_NAME#parw-v}"
          else
            export PARW_VERSION="${GITHUB_SHA::7}"
          fi
          SKIP_BUILD=1 ./script/selfhost-package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRAW-macos-universal
          path: |
            dist/PRAW-macos-universal.dmg
            dist/PRAW-macos-universal.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/parw-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "PRAW ${GITHUB_REF_NAME#parw-v}" \
            --notes "Self-hosted PRAW build for macOS. Drag PRAW.app into Applications, then clear the quarantine flag once: xattr -cr /Applications/PRAW.app. The app starts its own agent backend; see the repo README for provider setup and selfhost_server --doctor for diagnostics." \
            || gh release edit "${GITHUB_REF_NAME}" --title "PRAW ${GITHUB_REF_NAME#parw-v}"
          gh release upload "${GITHUB_REF_NAME}" dist/PRAW-macos-universal.dmg --clobber
