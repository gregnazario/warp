name: Tests (Linux)

# Fast, free regression net for the platform-neutral crates: the self-hosted
# backend and the server client's decode tests. Release builds remain macOS.
on:
  push:
    branches: [parw, master]
  pull_request:

concurrency:
  group: parw-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # prost-build invokes protoc for the multi-agent protobuf types;
      # fontconfig comes in through the client's font-kit dependency.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libfontconfig1-dev

      - name: Test self-hosted crates
        run: cargo test -p selfhost_server -p warp_server_client
